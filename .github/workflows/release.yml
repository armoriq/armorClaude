name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      release: ${{ steps.pr.outputs.release }}
    steps:
      - name: Find the merged pull request's labels
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null) | .labels[].name] | join(",")')
          if [[ ",$labels," == *",release,"* ]]; then echo "release=true" >> "$GITHUB_OUTPUT"; fi

  release:
    needs: label
    if: needs.label.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already tagged"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the version files and the notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release-version.mjs --check "$VERSION"
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
